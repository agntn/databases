packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob lets a sibling in the day it ships.
minimumReleaseAgeExclude:
  - "@agntn/*"

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0

# The library's versions, and docs/ next to them.
catalogs:
  deps:
    "@agntn/credentials": 0.1.0
    "@agntn/hashes": 0.7.3
    "@agntn/tools": 0.3.1
    "@modelcontextprotocol/sdk": 1.32.1
    "@modelcontextprotocol/server": 2.4.0
    "@vueuse/core": 14.4.0
    agents: 0.32.0
    better-sqlite3: 12.11.1
    docus: 5.15.0
    nuxt: 4.6.3
    postgres: 4.1.1
    ufo: 1.6.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.5.0
    "@iconify-json/lucide": 1.2.151
    "@iconify-json/simple-icons": 1.2.101
    "@iconify-json/vscode-icons": 1.2.96
    "@modelcontextprotocol/client": 2.4.0
    "@nuxt/content": 3.16.1
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/pi-coding-agent": 18.16.0
    "@types/node": 26.6.6
    ai: 7.0.163
    obuild: 0.4.45
    shiki: 4.5.0
    typescript: 7.0.2
    wrangler: 4.156.0
  # Docus's i18n plugin parses through @typescript-eslint, and TypeScript 7 has no JS API for it.
  nuxt:
    typescript: 5.9.3

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
